# Хуки перед комітом. Мета одна: не пускати в master те, що CI все одно
# завалить на кроці «Lint with ruff» (.github/workflows/tests.yml) — червоний
# білд після пуша коштує на порядок дорожче за секунду на коміті.
#
# ТІЛЬКИ ЛІНТ, БЕЗ ФОРМАТУВАННЯ. `ruff format` тут свідомо НЕ підключений:
# репозиторій ніколи не форматувався автоматично, тож перший же прогін
# переписав би майже кожен файл. Такий діф неможливо переглянути, він ховає в
# собі реальні правки і рве `git blame` на всій історії. Якщо формат колись і
# заводити — то окремим свідомим комітом «тільки формат», а не побічним
# ефектом хука.
#
# Набір правил живе в pyproject.toml ([tool.ruff.lint]: E + F, ignore E501) —
# один і той самий для хука, для CI і для локального `ruff check .`. Тримати
# другий перелік тут означало б рано чи пізно розійтись із CI.
#
# Встановити (одноразово, у .venv проєкту):
#   .venv\Scripts\python.exe -m pip install pre-commit
#   .venv\Scripts\python.exe -m pre_commit install
# Прогнати вручну по всьому репо:
#   .venv\Scripts\python.exe -m pre_commit run --all-files
# Разовий обхід (коли треба зафіксувати незавершене): git commit --no-verify

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Версія прибита цвяхами навмисно: плаваючий тег означав би, що новий реліз
    # ruff одного дня зробить коміт неможливим на рівному місці. Оновлювати
    # руками — тоді ж, коли й ruff у requirements-dev.txt.
    rev: v0.16.2
    hooks:
      # Саме `ruff-check`, а не легасі-аліас `ruff`: аліас лишили лише для
      # сумісності, і він колись зникне. `--force-exclude` (щоб extend-exclude
      # з pyproject.toml діяв і на поіменний список файлів від pre-commit) уже
      # вшитий в `entry` цього хука — дублювати в args не треба.
      - id: ruff-check
