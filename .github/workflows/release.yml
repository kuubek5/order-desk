name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify installer exists
        shell: powershell
        run: |
          $installerPath = "dist-installer\KuubMill-Setup-0.7.5.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer not found at $installerPath"
            exit 1
          }
          $fileSize = (Get-Item $installerPath).Length
          Write-Host "Installer ready: $installerPath ($(($fileSize/1MB).ToString('F1')) MB)"

      - name: Compute installer checksum
        shell: powershell
        run: |
          $installerPath = "dist-installer\KuubMill-Setup-0.7.5.exe"
          $checksumPath = "dist-installer\KuubMill-Setup-0.7.5.exe.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installerPath).Hash.ToLower()
          Set-Content -Path $checksumPath -Value $hash -NoNewline
          Write-Host "SHA256: $hash"

      - name: Smoke test - install and verify health
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = "dist-installer\KuubMill-Setup-0.7.5.exe"
          $installDir = "$env:LOCALAPPDATA\Programs\KuubMill"
          $exePath = "$installDir\KuubMill.exe"

          # Verify installer exists first
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer not found at $installerPath"
            exit 1
          }

          # Silently install the exe
          Write-Host "Installing KuubMill silently from $installerPath..."
          $process = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -NoNewWindow -Wait -PassThru
          $installExitCode = $process.ExitCode
          Write-Host "Installer exited with code: $installExitCode"
          if ($installExitCode -ne 0) {
            Write-Error "Installer failed with exit code $installExitCode"
            exit 1
          }
          Write-Host "Installer completed successfully"

          # Verify exe exists
          if (-not (Test-Path $exePath)) {
            Write-Error "Installed exe not found at $exePath"
            exit 1
          }
          Write-Host "Found installed exe at $exePath"

          # Launch the exe manually here. On a real workstation the installer's
          # own [Run] step relaunches the app under /VERYSILENT (that's the
          # auto-updater's restart path), but a headless CI runner has no
          # interactive desktop session, so `runasoriginaluser` [Run] is a no-op
          # here — meaning the mutex is free and this manual launch is what the
          # smoke test actually exercises. KUUBMILL_NONINTERACTIVE keeps a
          # startup-failure MessageBox from hanging the runner.
          Write-Host "Launching KuubMill..."
          $env:KUUBMILL_NONINTERACTIVE = "1"
          $logFile = "$env:TEMP\orderdesk-smoke-test.log"
          $errFile = "$env:TEMP\orderdesk-smoke-test-err.log"
          Start-Process -FilePath $exePath -WindowStyle Hidden -RedirectStandardOutput $logFile -RedirectStandardError $errFile | Out-Null
          Write-Host "Waiting for KuubMill to answer /health..."

          $healthUrl = "http://127.0.0.1:8000/health"
          # 180s: the onedir bundle grew (self-hosted fonts, three.js, extra JS),
          # so the first cold unpack + first-run DPAPI key + create_all on a CI
          # runner can take well over the old 90s before the port starts listening.
          $maxRetries = 180
          $retryDelaySeconds = 1
          $retryCount = 0
          $healthy = $false

          while ($retryCount -lt $maxRetries) {
            # Use curl.exe, not Invoke-WebRequest: on this runner IWR threw a
            # .NET NullReferenceException ("Object reference not set...") on a
            # perfectly ESTABLISHED localhost connection (proxy/keep-alive quirk),
            # so a healthy app read as failing. curl is unaffected. --noproxy
            # guards against any runner proxy env hijacking a loopback request.
            $code = (curl.exe -s -o NUL -w "%{http_code}" --max-time 3 --noproxy '*' $healthUrl 2>$null)
            if ($code -eq "200") {
              Write-Host "Health check passed (HTTP 200)"
              $healthy = $true
              break
            }
            if ($retryCount % 30 -eq 0) {
              Write-Host "  curl http_code: $code"
              Write-Host "  port 8000 (live): $(netstat -ano | Select-String ':8000')"
            }
            $retryCount++
            Write-Host "Health check attempt $retryCount/$maxRetries failed, retrying..."
            if ($retryCount -lt $maxRetries) {
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          # Stop whatever the installer launched
          try {
            Stop-Process -Name KuubMill -Force -ErrorAction SilentlyContinue
            Write-Host "Process stopped"
          } catch {
            # Process may have already exited
          }

          # Fail if health check never succeeded. Use Write-Host (not
          # Write-Error) for the headline: with $ErrorActionPreference='Stop'
          # a Write-Error is terminating and would abort the block before any
          # of the diagnostics below ever run, which is exactly why the real
          # cause stayed invisible across several failed release attempts.
          if (-not $healthy) {
            Write-Host "Health check failed after $maxRetries retries"
            if (Test-Path $logFile) {
              Write-Host "Last stdout from KuubMill:"
              Get-Content $logFile -Tail 20
            }
            if (Test-Path $errFile) {
              Write-Host "Last stderr from KuubMill:"
              Get-Content $errFile -Tail 20
            }
            $appLogFile = "$env:LOCALAPPDATA\KuubMill\logs\kuubmill.log"
            if (Test-Path $appLogFile) {
              Write-Host "Last KuubMill.log entries:"
              Get-Content $appLogFile -Tail 30
            }
            $startupErr = "$env:LOCALAPPDATA\KuubMill\logs\startup-error.txt"
            if (Test-Path $startupErr) {
              Write-Host "=== KuubMill startup-error.txt (the real cause) ==="
              Get-Content $startupErr
            } else {
              Write-Host "No startup-error.txt present (launcher except block not reached)."
            }
            Write-Host "=== Port 8000 listeners ==="
            netstat -ano | Select-String ":8000"
            Write-Error "Smoke test failed: health check never succeeded"
            exit 1
          }

          Write-Host "Smoke test passed"

      # Publish to the SEPARATE public releases repo, not this (private) one.
      # The built-in GITHUB_TOKEN only has rights on this repo, so a fine-grained
      # PAT with contents:write on the releases repo is provided as the
      # RELEASES_REPO_TOKEN secret. `repository` + `token` retarget the release
      # there; the app's update check reads from that public repo anonymously.
      - name: Create GitHub Release (public releases repo)
        uses: softprops/action-gh-release@v3
        with:
          repository: kuubek5/order-desk-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist-installer/KuubMill-Setup-0.7.5.exe
            dist-installer/KuubMill-Setup-0.7.5.exe.sha256
          fail_on_unmatched_files: true
