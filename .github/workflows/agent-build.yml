name: Build machine agent

# Збирає kmill-agent.exe для Windows (7/8/10/11) з Go 1.20 — остання версія Go
# з підтримкою Win7/8. Крос-компіляція без cgo на ubuntu, далі окремий windows-
# джоб пакує інсталятор Inno Setup (KMillAgent-Setup-*.exe). Артефакти качаються
# зі сторінки Actions цього запуску.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія для штампу (main.Version / інсталятор)"
        required: false
        default: "0.1.0"
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build (windows/amd64, Win7-11)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VER="${{ github.event.inputs.version || '0.1.0' }}"
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.Version=$VER" \
            -o kmill-agent.exe .
          ls -la kmill-agent.exe

      - name: Package (portable zip)
        run: zip -j kmill-agent.zip kmill-agent.exe config.example.json install.ps1 README.md

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: kmill-agent
          path: agent/kmill-agent.zip
          if-no-files-found: error

      - name: Upload exe (for the installer job)
        uses: actions/upload-artifact@v4
        with:
          name: kmill-agent-exe
          path: agent/kmill-agent.exe
          if-no-files-found: error

  installer:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: kmill-agent-exe
          path: agent

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || '0.1.0' }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss
          Get-ChildItem Output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KMillAgent-Setup
          path: agent/Output/*.exe
          if-no-files-found: error

      # Публікуємо в публічний репозиторій релізів під СТАЛИМ тегом
      # `agent-latest`: екран «Налаштування → Верстати» посилається саме на
      # нього, тож посилання не треба міняти з кожною збіркою. Артефакти
      # Actions для цього не годяться — вони вимагають входу в GitHub.
      - name: Publish to releases repo (stable link)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $exe = (Get-ChildItem Output\*.exe | Select-Object -First 1).FullName
          # Ім'я без версії — стале посилання для сторінки налаштувань.
          $stable = Join-Path (Split-Path $exe) 'KMillAgent-Setup.exe'
          Copy-Item $exe $stable -Force
          $repo = 'kuubek5/order-desk-releases'
          gh release view agent-latest --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create agent-latest --repo $repo --title "Агент верстата" `
              --notes "Інсталятор агента для ПК верстата. Посилання стале — оновлюється автоматично."
          }
          gh release upload agent-latest $stable --repo $repo --clobber
