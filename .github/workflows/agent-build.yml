name: Build machine agent

# Збирає kmill-agent.exe для Windows (7/8/10/11) з Go 1.20 — остання версія Go
# з підтримкою Win7/8. Крос-компіляція без cgo на ubuntu, далі окремий windows-
# джоб пакує інсталятор Inno Setup (KMillAgent-Setup-*.exe). Артефакти качаються
# зі сторінки Actions цього запуску.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія для штампу (main.Version / інсталятор)"
        required: false
        default: "0.1.0"
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Resolve dependencies
        run: go mod tidy

      # Розвідка файлів (discover.go) — єдине місце агента, що ходить по диску
      # верстата; її межі (лише теки програми, без виходу через «..») стережуть
      # тести.
      - name: Test (file discovery limits)
        run: go test ./...

      - name: Build (windows/amd64, Win7-11)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          # Версія за замовчуванням — дата + короткий SHA, а не сталий «0.1.0».
          # Досі КОЖЕН агент у цеху рапортував 0.1.0, тож відрізнити оновлений
          # від старого було неможливо навіть у власному лозі (бойовий випадок
          # 04.09.26: у лозі мертвого агента стояло 0.1.0, і це нічого не
          # говорило про те, який саме білд там стоїть).
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          # Час збірки — те, чим агент порівнює версії при самооновленні
          # (selfupdate.go): «дата-хеш» упорядкувати не можна. Той самий штамп
          # іде в підписаний маніфест нижче.
          BUILT="$(date -u +%s)"
          echo "AGENT_VER=$VER" >> "$GITHUB_ENV"
          echo "AGENT_BUILT=$BUILT" >> "$GITHUB_ENV"
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.Version=$VER -X main.BuildStamp=$BUILT" \
            -o kmill-agent.exe .
          ls -la kmill-agent.exe

      # Підпис для самооновлення: manifest.json + manifest.sig поруч з exe.
      # Ключ — секрет AGENT_SIGNING_KEY; публічна частина зашита в агента
      # (internal/upd.TrustedKeys), і інструмент сам звіряє їх після підпису.
      # Без секрету (форк, чужий PR) крок пропускається: агент збирається, але
      # файла оновлення для нього немає — ставиться лише інсталятором.
      - name: Sign for self-update
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          if [ -z "$AGENT_SIGNING_KEY" ]; then
            echo "AGENT_SIGNING_KEY не задано — підпис пропущено"
            exit 0
          fi
          go run ./tools/sign -exe kmill-agent.exe -version "$AGENT_VER" -built "$AGENT_BUILT"
          ls -la manifest.json manifest.sig

      - name: Package (portable zip)
        run: zip -j kmill-agent.zip kmill-agent.exe config.example.json install.ps1 README.md

      # retention-days: 7 — артефакти агента це build-вихід, а не спосіб
      # доставки (агент качається з тега `agent-latest` у публічному
      # релізному репо, див. джоб installer). Дефолтні 90 днів накопичували
      # їх щопуш, і безкоштовне сховище Actions (500 МБ) заповнилось на 100%
      # за пів місяця — 506 артефактів, 1.3 ГБ (20.09.26). Тиждень вистачає,
      # щоб за потреби зняти exe останніх білдів зі сторінки Actions.
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: kmill-agent
          path: agent/kmill-agent.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload exe (for the installer job)
        uses: actions/upload-artifact@v4
        with:
          name: kmill-agent-exe
          # Маніфест і підпис є лише коли крок підпису відпрацював.
          path: |
            agent/kmill-agent.exe
            agent/manifest.json
            agent/manifest.sig
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: kmill-agent-exe
          path: agent

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          # Той самий штамп, що й у exe (див. джоб build): дата + короткий SHA.
          # Inno вимагає числову версію, тож у нього йде дата, а повний штамп
          # лишається всередині exe.
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = (Get-Date -Format "yyyy.MM.dd") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss
          Get-ChildItem Output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KMillAgent-Setup
          path: agent/Output/*.exe
          if-no-files-found: error
          retention-days: 7

      # Публікуємо в публічний репозиторій релізів під СТАЛИМ тегом
      # `agent-latest`: екран «Налаштування → Верстати» посилається саме на
      # нього, тож посилання не треба міняти з кожною збіркою. Артефакти
      # Actions для цього не годяться — вони вимагають входу в GitHub.
      #
      # З master І з тегів релізів `v*`. Досі лише з master, а релізи давно
      # йдуть з іншої гілки — і посилання в CRM тижнями віддавало агента без
      # виправлень (10.09.26: власник поставив з нього збірку 7dfb561 від 08.09,
      # у якій агент падав раз на ~3 год). Тег релізу тригерить цей workflow
      # завжди (фільтр `paths` на теги не діє), тож агент за посиланням тепер
      # оновлюється разом із кожним релізом CRM.
      - name: Publish to releases repo (stable link)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $exe = (Get-ChildItem Output\*.exe | Select-Object -First 1).FullName
          # Ім'я без версії — стале посилання для сторінки налаштувань.
          $stable = Join-Path (Split-Path $exe) 'KMillAgent-Setup.exe'
          Copy-Item $exe $stable -Force
          $repo = 'kuubek5/order-desk-releases'
          gh release view agent-latest --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            # --prerelease ОБОВ'ЯЗКОВИЙ, це не косметика. GitHub віддає
            # /releases/latest як найновіший НЕ-prerelease за датою створення, а
            # KuubMill саме звідти дізнається про оновлення (app/update_check.py).
            # Звичайний реліз `agent-latest`, створений пізніше за останній
            # KuubMill-реліз, став би «найновішим», його тег не читається як
            # версія — і всі встановлені машини назавжди бачили б «у вас
            # найновіша версія» без жодної помилки (аудит 08.09.26).
            # Пряме посилання на асет у Налаштуваннях → Верстати від цього не
            # страждає: воно веде на файл за тегом, а prerelease так само
            # завантажується.
            gh release create agent-latest --repo $repo --title "Агент верстата" `
              --prerelease `
              --notes "Інсталятор агента для ПК верстата. Посилання стале — оновлюється автоматично."
          }
          gh release upload agent-latest $stable --repo $repo --clobber
          # Файл для самооновлення агентів: CRM качає ці три звідси й надсилає
          # на верстат (app/services/agent_update.py). Усі три або жодного:
          # exe без підпису агент однаково не прийме, а половина набору лише
          # заплутала б.
          if ((Test-Path manifest.json) -and (Test-Path manifest.sig)) {
            Copy-Item manifest.json kmill-agent.manifest.json -Force
            Copy-Item manifest.sig kmill-agent.manifest.sig -Force
            gh release upload agent-latest kmill-agent.exe kmill-agent.manifest.json kmill-agent.manifest.sig --repo $repo --clobber
          } else {
            Write-Host "Підпису немає — файл самооновлення не публікується"
          }
