name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # The real product only ships on Windows (standalone PyInstaller/Inno
    # Setup install, DPAPI-backed secrets) — running CI on windows-latest
    # matches that target instead of guessing at Linux compatibility for
    # Windows-only code paths (app/windows_dpapi.py, app/windows_launcher.py).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      # mypy тут — ХРАПОВИК, а не ворота. «Informational only» означало, що
      # число помилок ніхто не читає: у коментарі стояло «26 у 4 файлах», а
      # насправді їх було вже 212 у 41 (ревʼю 07.09.26, T.4). Тепер поточне
      # число зафіксоване у .mypy-baseline: більше — крок падає, менше —
      # просить оновити файл, щоб планка не сповзала назад.
      - name: Type check with mypy (ratchet)
        shell: bash
        run: |
          set +e
          output="$(python -m mypy app --ignore-missing-imports)"
          status=$?
          echo "$output" | tail -20
          found="$(echo "$output" | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+' | head -1)"
          if [ -z "$found" ]; then
            if [ "$status" -ne 0 ]; then
              echo "mypy не дав числа помилок і завершився з кодом $status"
              exit 1
            fi
            found=0
          fi
          baseline="$(tr -d '[:space:]' < .mypy-baseline)"
          echo "mypy: $found, планка: $baseline"
          if [ "$found" -gt "$baseline" ]; then
            echo "::error::Помилок типів побільшало: $found проти $baseline. Полагодьте нові або поясніть."
            exit 1
          fi
          if [ "$found" -lt "$baseline" ]; then
            echo "::notice::Помилок стало менше ($found). Оновіть .mypy-baseline, щоб планка не сповзла назад."
          fi

      - name: Run tests with coverage
        # DB_ENCRYPTION_KEY only needs to be a valid Fernet key for the
        # ephemeral CI sqlite DB each run creates and discards — it protects
        # nothing real here, unlike the DPAPI-backed key on a real install
        # (CLAUDE.md section 7), so a fixed CI-only value is fine to commit.
        env:
          DB_ENCRYPTION_KEY: "Un82ZLqj-Mb9wutrlh4s384pKBsG1WMn1GCYncpWgTw="
        run: python -m pytest -q --cov=app --cov-report=term-missing
