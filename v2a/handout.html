<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Desk — Ранкова видача</title>
<link rel="icon" type="image/png" href="../screens/higg/app_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Barlow:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;
  --bg-rail:#0a0e14;
  --card:#161d27;
  --card-2:#1b2431;
  --card-3:#202b3a;
  --line:#222c3a;
  --line-2:#2c3849;
  --ink:#e8eff7;
  --ink-2:#8fa3bb;
  --ink-3:#7789a0;
  --accent:#14b8a6;
  --accent-b:#2dd4bf;
  --accent-c:#5eead4;
  --accent-d:#0f766e;
  --alarm:#f87171;
  --warn:#f0a35e;
  --r-card:10px;
  --r-ctl:9px;
  --glow:inset 0 1px 0 rgba(255,255,255,.045), inset 0 0 44px -26px rgba(45,212,191,.75), 0 18px 38px -30px rgba(0,0,0,.95);
  --sh-pop:0 14px 34px -18px rgba(0,0,0,.86), 0 2px 6px -2px rgba(0,0,0,.6);

  /* ---- tweak-panel-controlled tokens ---- */
  --font-head:'Golos Text',sans-serif;
  --font-body:'Golos Text',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --size-h1:22px;
  --ls-head:-.015em;
  --size-body:14px;
  --lh-body:1.45;
  --ui-speed:.14s;
  --sweep-duration:980ms;
  --beacon-duration:2.6s;
  --panel-duration:.22s;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:var(--size-body);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-b);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- rail (copied verbatim from index.html) ---------- */
.rail{
  width:228px;flex:0 0 228px;background:var(--bg-rail);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px 12px;gap:18px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 0}
.brand .mark{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;
  background:linear-gradient(160deg,rgba(45,212,191,.22),rgba(20,184,166,.06));
  border:1px solid rgba(45,212,191,.34);display:grid;place-items:center;
  box-shadow:inset 0 0 18px -8px rgba(45,212,191,.9);
}
.brand .mark svg{width:16px;height:16px;stroke:var(--accent-b)}
.brand .mark img{width:22px;height:22px;object-fit:contain;border-radius:5px}
.brand b{font-family:var(--font-head);font-weight:600;font-size:15.5px;letter-spacing:.01em}
.brand span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;margin-top:-2px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-ctl);
  color:var(--ink-2);font-weight:500;font-size:13.5px;text-align:left;
  transition:background var(--ui-speed) ease,color var(--ui-speed) ease;
}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav-item:hover{background:#141b25;color:var(--ink)}
.nav-item[aria-current="page"]{
  background:linear-gradient(90deg,rgba(20,184,166,.16),rgba(20,184,166,.03));
  color:var(--accent-c);box-shadow:inset 1px 0 0 var(--accent);
}
.nav-item .count{
  margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:500;
  padding:1px 6px;border-radius:5px;background:rgba(45,212,191,.14);color:var(--accent-c);
  border:1px solid rgba(45,212,191,.26);
}
.nav-item .count.warn{background:rgba(240,163,94,.13);color:var(--warn);border-color:rgba(240,163,94,.28)}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 2px;display:flex;gap:10px;align-items:center}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--card-3);border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--accent-c)}
.rail-foot .who{font-size:12.5px;font-weight:500;line-height:1.25}
.rail-foot .who span{display:block;font-size:11px;color:var(--ink-3)}

/* ---------- main shell ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:16px 20px 16px}

.topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.topbar-title h1{font-family:var(--font-head);font-size:var(--size-h1);font-weight:600;letter-spacing:var(--ls-head);margin:0 0 4px}
.topbar-live{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.topbar-live b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-size:11.5px}
.topbar-live .sep{width:1px;height:10px;background:var(--line-2)}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-ctl);
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:13px;font-weight:500;
  transition:border-color var(--ui-speed) ease,background var(--ui-speed) ease,color var(--ui-speed) ease;
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--card-2);border-color:#3a4a5f}
.btn.primary{background:rgba(20,184,166,.15);border-color:rgba(45,212,191,.42);color:var(--accent-c)}
.btn.primary:hover{background:rgba(20,184,166,.24);border-color:var(--accent)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- overall progress strip ---------- */
.statusline{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-card);
  background:var(--card);box-shadow:var(--glow);
}
.sl-counters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.sl-item{
  display:inline-flex;align-items:baseline;gap:5px;font-size:12.5px;color:var(--ink-2);
  padding:3px 8px 3px 6px;border-radius:999px;
}
.sl-item b{font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--ink);letter-spacing:-.01em}
.sl-item.is-warn b{color:var(--warn)}
.sl-item.is-ok b{color:var(--accent-c)}
.sl-sep{width:1px;height:14px;background:var(--line-2);flex:0 0 auto}
.headline-track{flex:0 0 220px;height:8px;border-radius:4px;background:#111823;border:1px solid #1c2532;overflow:hidden}
.headline-track i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent-b));transform-origin:left center;transition:transform .28s cubic-bezier(.16,.84,.32,1)}

/* ---------- content scroll area ---------- */
.handout-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.clients{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}

/* ---------- client card ---------- */
.ccard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--glow);
  overflow:hidden;transition:opacity .22s ease,transform .22s ease;
}
.ccard.late{box-shadow:var(--glow), inset 3px 0 0 var(--warn)}
.ccard.collapsed .cbody{display:none}
.ccard.done{opacity:.72}
.ccard.done .card-head{background:linear-gradient(90deg,rgba(20,184,166,.1),rgba(20,184,166,0))}

.card-head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;width:100%;text-align:left}
.ccard.collapsed .card-head{border-bottom:0}
.card-head h2{font-family:var(--font-head);font-size:15.5px;font-weight:600;margin:0;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.card-head .doneicon{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:rgba(20,184,166,.18);border:1px solid rgba(45,212,191,.5);display:none;align-items:center;justify-content:center}
.card-head .doneicon svg{width:11px;height:11px;stroke:var(--accent-c);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ccard.done .card-head .doneicon{display:inline-flex}
.card-head .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.card-head .badge{font-size:10.5px;padding:2px 8px;border-radius:5px;font-weight:500;background:rgba(240,163,94,.13);color:var(--warn);border:1px solid rgba(240,163,94,.3)}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.card-head .progress-wrap{display:flex;flex-direction:column;gap:5px;width:150px}
.card-head .progress-num{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right}
.card-head .progress-num b{color:var(--ink);font-weight:600}
.track{height:6px;border-radius:3px;background:#111823;overflow:hidden;border:1px solid #1c2532}
.track i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent-b));transform-origin:left center;transition:transform .28s cubic-bezier(.16,.84,.32,1)}
.ccard.done .track i{background:linear-gradient(90deg,var(--accent-d),var(--accent-c))}
.chev{width:15px;height:15px;flex:0 0 15px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s ease}
.ccard:not(.collapsed) .chev{transform:rotate(180deg)}

.cbody{padding:4px 16px 14px}

/* ambiguous-match banner */
.ambig{
  display:flex;flex-direction:column;gap:9px;padding:11px 12px;border-radius:9px;margin:9px 0 13px;
  background:rgba(240,163,94,.08);border:1px solid rgba(240,163,94,.3);
}
.ambig .ahead{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--warn)}
.ambig .ahead svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.ambig .ahead b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
.ambig .ahead p{margin:2px 0 0;color:var(--ink-2);font-size:12px;line-height:1.4}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;
  background:#111823;border:1px solid var(--line-2);transition:background var(--ui-speed) ease,border-color var(--ui-speed) ease;
}
.cand:hover{background:var(--card-2);border-color:#3a4a5f}
.cand .p{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .t{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);flex:0 0 auto}
.cand .pick{
  flex:0 0 auto;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(45,212,191,.4);
  background:rgba(20,184,166,.14);color:var(--accent-c);font-size:11.5px;font-weight:500;
}
.cand .pick:hover{background:rgba(20,184,166,.24)}
.ambig.resolved .cands{display:none}
.ambig.resolved{background:rgba(20,184,166,.08);border-color:rgba(45,212,191,.28)}
.ambig.resolved .ahead{color:var(--accent-c)}
.ambig .chosen-note{display:none;font-family:var(--font-mono);font-size:11.5px;color:var(--accent-c)}
.ambig.resolved .chosen-note{display:block}

/* work rows */
.works{display:flex;flex-direction:column}
.wrow{
  display:flex;align-items:center;gap:12px;padding:10px 2px;
}
.wrow+.wrow{border-top:1px solid #1b2431}
.wrow.found{opacity:.55}
.wcheck{
  flex:0 0 26px;width:26px;height:26px;border-radius:7px;border:1.6px solid var(--line-2);background:#111823;
  display:flex;align-items:center;justify-content:center;transition:background var(--ui-speed) ease,border-color var(--ui-speed) ease;
}
.wcheck svg{width:14px;height:14px;stroke:var(--bg);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--ui-speed) ease}
.wrow.found .wcheck{background:var(--accent-b);border-color:var(--accent-b)}
.wrow.found .wcheck svg{opacity:1}
.wcheck:hover{border-color:var(--accent-b)}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wmain .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wmain .ord{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink)}
.wrow.found .wmain .ord{text-decoration:line-through;color:var(--ink-3)}
.matchip{
  display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;
  background:#1d2734;border:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2);
}
.wkind{font-size:12px;color:var(--ink-3)}
.wpath{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.wpath.pending{color:#8a6540;font-style:normal}

.cfoot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid #1b2431}

/* empty / not-started state */
.notyet{font-size:12px;color:var(--ink-3);font-style:normal}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1080px){
  .rail{width:60px;flex:0 0 60px;padding:16px 8px 10px;align-items:stretch}
  .brand .txt,.nav-title,.nav-item span.lb,.rail-foot .who{display:none}
  .nav-item{justify-content:center;padding:9px 0;position:relative}
  .nav-item .count{position:absolute;top:2px;right:4px;margin:0;font-size:9.5px;padding:0 4px}
  .rail-foot{justify-content:center}
}
@media (max-width:820px){
  .card-head .progress-wrap{width:110px}
  .headline-track{flex:0 0 140px}
}
@media (max-width:640px){
  .card-head{flex-wrap:wrap}
  .card-head .right{margin-left:0;width:100%;justify-content:space-between}
  .card-head .progress-wrap{width:auto;flex:1}
  .statusline{flex-direction:column;align-items:stretch}
  .headline-track{flex:1 1 auto;width:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<!--
THESIS: ранкова видача — короткий, зосереджений ритуал «клієнт за клієнтом»; екран мінімізує пошук очима, максимізує швидкість відмітки «знайдено» і явно показує, де зіставлення з export не однозначне.
OWN-WORLD: палітра v2a без змін — синьо-чорне тло, бірюзовий сигнал, попередження теплим оранжем; Golos Text + JetBrains Mono; тонка рамка, --glow на картках, чіп-теги матеріалу, моно для шляхів.
STORY: оператор гортає картки клієнтів вчорашнього дня; клікає «знайдено» по кожній роботі — прогрес-бар і лічильник миттєво ростуть; коли зібрано все, картка сама згортається й сіріє з галочкою; для Мазур В. зіставлення неоднозначне — два шляхи-кандидати з часом створення, оператор обирає клацанням, інші зникають.
FIRST VIEWPORT: рейл зліва; заголовок з датою вкладки і сумарним прогресом; список карток клієнтів на всю висоту.
FORM: екран «Ранкова видача» всередині закріпленого світу v2a.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<aside class="rail">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <img src="../screens/higg/app_icon.png" alt="">
    </span>
    <span class="txt"><b>Order Desk</b><span>фрезерний центр</span></span>
  </div>

  <nav class="nav-group" aria-label="Основна навігація">
    <div class="nav-title">Робота</div>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="3.5" cy="6" r="1.2"></circle><circle cx="3.5" cy="12" r="1.2"></circle><circle cx="3.5" cy="18" r="1.2"></circle></svg>
      <span class="lb">Черга</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></svg>
      <span class="lb">Нові з пошти</span><span class="count">6</span>
    </button>
    <button class="nav-item" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5z"></path><path d="M3 8.5 12 13l9-4.5M12 13v7"></path></svg>
      <span class="lb">Ранкова видача</span><span class="count warn" id="railCount">2</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"></path><path d="M16 6.2A3.2 3.2 0 0 1 16 14"></path><path d="M18 19c-.3-1.7-1-3-2-3.9"></path></svg>
      <span class="lb">Клієнти</span>
    </button>
  </nav>

  <nav class="nav-group" aria-label="Аналітика та система">
    <div class="nav-title">Система</div>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      <span class="lb">Пошук</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-7M22 20H2"></path></svg>
      <span class="lb">Статистика</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2.2"></circle><circle cx="10" cy="17" r="2.2"></circle></svg>
      <span class="lb">Налаштування</span>
    </button>
  </nav>

  <div class="rail-foot">
    <span class="avatar">ОГ</span>
    <span class="who">Оксана Гриценко<span>CAM-оператор</span></span>
  </div>
</aside>

<main class="main">

  <div class="topbar">
    <div class="topbar-title">
      <h1>Ранкова видача</h1>
      <div class="topbar-live">
        <span>вкладка <b>10.08.26</b>, вчора</span>
        <span class="sep" aria-hidden="true"></span>
        <span>папка <b class="mono">export</b> перевірена <b>3 хв тому</b></span>
      </div>
    </div>
    <div class="head-actions">
      <button class="btn sm" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9M4 13a8 8 0 0 0 14.3 4.9"></path><path d="M4 4v4h4M20 20v-4h-4"></path></svg>Оновити зіставлення
      </button>
    </div>
  </div>

  <div class="statusline">
    <div class="sl-counters">
      <span class="sl-item is-warn"><b class="tnum" id="hlNum">2</b> клієнти без видачі</span>
      <span class="sl-sep" aria-hidden="true"></span>
      <span class="sl-item"><b class="tnum" id="hlUnits">7 з 15</b> одиниць знайдено</span>
    </div>
    <div class="headline-track"><i id="hlBar" style="transform:scaleX(.47)"></i></div>
  </div>

  <div class="handout-scroll">
    <div class="clients" id="clients"></div>
  </div>

</main>

<script>
(function(){
  "use strict";
  var $  = function(s,root){return (root||document).querySelector(s);};
  var $$ = function(s,root){return Array.prototype.slice.call((root||document).querySelectorAll(s));};
  var esc = function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};

  // Демонстраційні дані видачі — реальні матеріали/наряди з пулу index.html
  var CLIENTS = [
    {
      id:"kravchuk", name:"Кравчук Л.", late:true,
      path:"export\\Кравчук Л\\нова папка (7)\\пмма a2", pathTime:"08:41",
      works:[
        {ord:"24136", mat:"пмма A2", kind:"анатомія", found:true},
        {ord:"24154", mat:"пмма A3", kind:"анатомія", found:true},
        {ord:"24142", mat:"пмма A3", kind:"анатомія", found:true},
        {ord:"24151", mat:"пмма A2", kind:"вкладка", found:false},
        {ord:"24145", mat:"пмма A2", kind:"анатомія", found:false}
      ]
    },
    {
      id:"mazur", name:"Мазур В.", late:true,
      ambiguous:true,
      candidates:[
        {path:"export\\Мазур В\\нова папка (4)\\моно b1", time:"09:02"},
        {path:"export\\Мазур В.\\нова папка (9)\\моно b1", time:"07:18"}
      ],
      works:[
        {ord:"24139", mat:"моно B1", kind:"вкладка", found:true},
        {ord:"24160", mat:"титан корея", kind:"абатмент", found:true},
        {ord:"24137", mat:"моно А3.5", kind:"анатомія гвинтова", found:false},
        {ord:"24133", mat:"800", kind:"каркас міст 13-23", found:false}
      ]
    },
    {
      id:"bondar", name:"Бондар І.", late:true,
      path:"export\\Бондар І\\нова папка (2)\\моно а3.5", pathTime:"07:55",
      works:[
        {ord:"24150", mat:"моно А3.5", kind:"каркас міст 14-24", found:true},
        {ord:"24109", mat:"моно А3.5", kind:"каркас міст 14-24", found:true},
        {ord:"24127", mat:"моно А3.5", kind:"анатомія", found:true}
      ]
    },
    {
      id:"tymkiv", name:"Тимків Р.", late:true,
      path:"export\\Тимків Р\\нова папка (5)\\титан корея", pathTime:"—",
      works:[
        {ord:"24147", mat:"титан корея", kind:"абатмент", found:false},
        {ord:"24131", mat:"титан корея", kind:"абатмент", found:false},
        {ord:"24118", mat:"моно А3.5", kind:"анатомія гвинтова", found:false}
      ]
    }
  ];

  var root = $("#clients");

  function progress(c){
    var total = c.works.length;
    var found = c.works.filter(function(w){ return w.found; }).length;
    return {total:total, found:found, isDone: total>0 && found===total};
  }

  function clientCardHtml(c){
    var p = progress(c);
    var pct = p.total ? Math.round(p.found/p.total*100) : 0;
    var isDone = p.isDone;
    var startCollapsed = isDone;

    var ambigHtml = "";
    if(c.ambiguous){
      var resolved = c.resolvedPath;
      ambigHtml = ''
        + '<div class="ambig'+(resolved ? " resolved" : "")+'" data-ambig="'+esc(c.id)+'">'
          + '<div class="ahead">'
            + (resolved
              ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"></circle><path d="m8.4 12.2 2.5 2.5 4.7-5"></path></svg>'
              : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5"></path><circle cx="12" cy="16.4" r=".9" fill="currentColor" stroke="none"></circle><path d="M10.3 3.9 2.6 17.6A1.9 1.9 0 0 0 4.3 20.5h15.4a1.9 1.9 0 0 0 1.7-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0z"></path></svg>')
            + '<span>'
              + '<b>'+(resolved ? "Папку обрано" : "Неоднозначне зіставлення")+'</b>'
              + '<p>'+(resolved ? "Далі шлях підставляється у роботи цього клієнта." : "Нечітке зіставлення знайшло кілька папок-кандидатів (можлива одруківка в імені). Оберіть правильну.")+'</p>'
            + '</span>'
          + '</div>'
          + '<div class="cands">'
            + c.candidates.map(function(cand, i){
                return '<button class="cand" type="button" data-pick="'+esc(c.id)+'" data-idx="'+i+'">'
                  + '<span class="p mono">'+esc(cand.path)+'</span>'
                  + '<span class="t mono">створено '+esc(cand.time)+'</span>'
                  + '<span class="pick">Обрати</span>'
                + '</button>';
              }).join("")
          + '</div>'
          + '<div class="chosen-note mono">'+(resolved ? esc(resolved) : "")+'</div>'
        + '</div>';
    }

    var pathBlock = c.ambiguous
      ? ambigHtml
      : '<div class="wpath-line" style="margin:9px 0 13px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px">'
        + '<span class="mono" style="color:var(--ink-2)">'+esc(c.path)+'</span><span>· створено '+esc(c.pathTime)+'</span>'
        + '</div>';

    var worksHtml = c.works.map(function(w, i){
      return '<div class="wrow'+(w.found ? " found" : "")+'" data-client="'+esc(c.id)+'" data-widx="'+i+'">'
        + '<button class="wcheck" type="button" data-toggle-found="'+esc(c.id)+'" data-widx="'+i+'" aria-pressed="'+(w.found?"true":"false")+'" aria-label="Позначити наряд '+esc(w.ord)+' знайденим">'
          + '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"></path></svg>'
        + '</button>'
        + '<div class="wmain">'
          + '<div class="top"><span class="ord mono">'+esc(w.ord)+'</span><span class="matchip">'+esc(w.mat)+'</span></div>'
          + '<div class="wkind">'+esc(w.kind)+'</div>'
        + '</div>'
      + '</div>';
    }).join("");

    return ''
      + '<section class="ccard'+(isDone?" done":"")+(c.late?" late":"")+(startCollapsed?" collapsed":"")+'" data-client-card="'+esc(c.id)+'">'
        + '<button class="card-head" type="button" data-toggle-card="'+esc(c.id)+'" aria-expanded="'+(startCollapsed?"false":"true")+'">'
          + '<span class="doneicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"></path></svg></span>'
          + '<h2>'+esc(c.name)+'</h2>'
          + (c.late ? '<span class="badge">вчора</span>' : '')
          + '<span class="right">'
            + '<span class="progress-wrap">'
              + '<span class="progress-num" data-progress-num="'+esc(c.id)+'"><b>'+p.found+'</b> з '+p.total+' знайдено</span>'
              + '<span class="track"><i data-progress-bar="'+esc(c.id)+'" style="transform:scaleX('+(pct/100)+')"></i></span>'
            + '</span>'
            + '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>'
          + '</span>'
        + '</button>'
        + '<div class="cbody">'
          + pathBlock
          + '<div class="works">'+worksHtml+'</div>'
          + '<div class="cfoot"><span class="notyet mono" style="margin-right:auto" data-hint="'+esc(c.id)+'"></span></div>'
        + '</div>'
      + '</section>';
  }

  function renderHeadline(){
    var totalClients = CLIENTS.length;
    var doneClients = CLIENTS.filter(function(c){ return progress(c).isDone; }).length;
    var pendingClients = totalClients - doneClients;
    var totalUnits = 0, foundUnits = 0;
    CLIENTS.forEach(function(c){
      var p = progress(c);
      totalUnits += p.total; foundUnits += p.found;
    });
    $("#hlNum").textContent = pendingClients;
    $("#hlUnits").textContent = foundUnits + " з " + totalUnits;
    $("#hlBar").style.transform = "scaleX(" + (totalUnits ? foundUnits/totalUnits : 0) + ")";
    $("#railCount").textContent = pendingClients;
    var slItem = $(".sl-item.is-warn");
    if(pendingClients === 0){ slItem.classList.remove("is-warn"); slItem.classList.add("is-ok"); }
    else { slItem.classList.add("is-warn"); slItem.classList.remove("is-ok"); }
  }

  function renderAll(){
    root.innerHTML = CLIENTS.map(clientCardHtml).join("");
    renderHeadline();
  }

  root.addEventListener("click", function(e){
    var pickBtn = e.target.closest("[data-pick]");
    if(pickBtn){
      var cid = pickBtn.dataset.pick, idx = parseInt(pickBtn.dataset.idx, 10);
      var c = CLIENTS.filter(function(x){ return x.id === cid; })[0];
      if(c){ c.resolvedPath = c.candidates[idx].path; }
      renderAll();
      return;
    }

    var toggleBtn = e.target.closest("[data-toggle-found]");
    if(toggleBtn){
      var cid2 = toggleBtn.dataset.toggleFound, widx = parseInt(toggleBtn.dataset.widx, 10);
      var c2 = CLIENTS.filter(function(x){ return x.id === cid2; })[0];
      if(c2){
        var wasDone = progress(c2).isDone;
        c2.works[widx].found = !c2.works[widx].found;
        var nowDone = progress(c2).isDone;
        renderAll();
        if(!wasDone && nowDone){
          var card = $('.ccard[data-client-card="'+cid2+'"]');
          if(card){
            setTimeout(function(){ card.classList.add("collapsed"); var h=card.querySelector(".card-head"); if(h) h.setAttribute("aria-expanded","false"); }, 260);
          }
        }
      }
      return;
    }

    var toggleCard = e.target.closest("[data-toggle-card]");
    if(toggleCard){
      var cid3 = toggleCard.dataset.toggleCard;
      var card3 = $('.ccard[data-client-card="'+cid3+'"]');
      if(card3){
        var collapsed = card3.classList.toggle("collapsed");
        toggleCard.setAttribute("aria-expanded", String(!collapsed));
      }
      return;
    }
  });

  renderAll();
})();
</script>

<script>
(function(){
  "use strict";
  var root = document.documentElement;
  var $ = function(s,r){ return (r||document).querySelector(s); };

  var FONT_SANS = [
    ["'Barlow',sans-serif","Barlow (поточний)"],
    ["'Space Grotesk',sans-serif","Space Grotesk"],
    ["'Sora',sans-serif","Sora"],
    ["'Manrope',sans-serif","Manrope"],
    ["'Plus Jakarta Sans',sans-serif","Plus Jakarta Sans"],
    ["'DM Sans',sans-serif","DM Sans"],
    ["'IBM Plex Sans',sans-serif","IBM Plex Sans"],
    ["'Outfit',sans-serif","Outfit"],
    ["'Public Sans',sans-serif","Public Sans"],
    ["'Work Sans',sans-serif","Work Sans"],
    ["'Golos Text',sans-serif","Golos Text (кирилиця)"],
    ["'PT Sans',sans-serif","PT Sans (кирилиця)"],
    ["'Unbounded',sans-serif","Unbounded (кирилиця)"],
    ["'Onest',sans-serif","Onest (кирилиця)"],
    ["__custom__","Інша (ввести назву)…"]
  ];
  var FONT_MONO = [
    ["'Azeret Mono',monospace","Azeret Mono (поточний)"],
    ["'JetBrains Mono',monospace","JetBrains Mono"],
    ["'IBM Plex Mono',monospace","IBM Plex Mono"],
    ["'Space Mono',monospace","Space Mono"],
    ["'Red Hat Mono',monospace","Red Hat Mono"],
    ["'Roboto Mono',monospace","Roboto Mono"],
    ["__custom__","Інша (ввести назву)…"]
  ];

  var loadedFonts = {};
  function loadGoogleFont(name){
    if(loadedFonts[name]) return;
    loadedFonts[name] = true;
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(name).replace(/%20/g,"+") + ":wght@400;500;600;700&display=swap";
    document.head.appendChild(link);
  }
  // preload the curated lists so switching feels instant
  FONT_SANS.concat(FONT_MONO).forEach(function(f){
    if(f[0] === "__custom__") return;
    var m = f[0].match(/'([^']+)'/);
    if(m) loadGoogleFont(m[1]);
  });

  var DEFAULTS = {};
  var TOKENS = ["--bg","--bg-rail","--card","--card-2","--card-3","--line","--line-2",
    "--ink","--ink-2","--ink-3","--accent","--accent-b","--accent-c","--accent-d","--alarm","--warn",
    "--r-card","--r-ctl","--font-head","--font-body","--font-mono","--size-h1","--ls-head",
    "--size-body","--lh-body","--ui-speed","--sweep-duration","--beacon-duration","--panel-duration","--glow"];
  TOKENS.forEach(function(t){ DEFAULTS[t] = getComputedStyle(root).getPropertyValue(t).trim(); });

  function setVar(name, val){ root.style.setProperty(name, val); }
  function px(name){ return parseFloat(getComputedStyle(root).getPropertyValue(name)) || 0; }
  function ms(name){
    var v = getComputedStyle(root).getPropertyValue(name).trim();
    if(v.slice(-2) === "ms") return parseFloat(v);
    if(v.slice(-1) === "s") return parseFloat(v) * 1000;
    return parseFloat(v) || 0;
  }

  var body = $("#tp-body");

  function section(title){
    var s = document.createElement("div"); s.className = "tp-sec";
    var h = document.createElement("h3"); h.textContent = title;
    s.appendChild(h); body.appendChild(s); return s;
  }
  function colorRow(sec, label, varName){
    var row = document.createElement("div"); row.className = "tp-row";
    var lb = document.createElement("label"); lb.textContent = label;
    var inp = document.createElement("input"); inp.type = "color";
    var cur = getComputedStyle(root).getPropertyValue(varName).trim();
    inp.value = /^#/.test(cur) ? cur : "#000000";
    inp.addEventListener("input", function(){ setVar(varName, inp.value); });
    row.appendChild(lb); row.appendChild(inp);
    sec.appendChild(row);
  }
  function rangeRow(sec, label, varName, min, max, step, unit, getFn, setFn){
    var row = document.createElement("div"); row.className = "tp-row";
    var lb = document.createElement("label"); lb.textContent = label;
    var inp = document.createElement("input"); inp.type = "range";
    inp.min = min; inp.max = max; inp.step = step;
    var val = document.createElement("span"); val.className = "tp-val";
    var cur = getFn();
    inp.value = cur;
    val.textContent = cur + unit;
    inp.addEventListener("input", function(){
      setFn(inp.value);
      val.textContent = inp.value + unit;
    });
    row.appendChild(lb); row.appendChild(inp); row.appendChild(val);
    sec.appendChild(row);
  }
  function fontRow(sec, label, varName, list){
    var row = document.createElement("div"); row.className = "tp-row";
    var lb = document.createElement("label"); lb.textContent = label;
    var sel = document.createElement("select");
    var cur = getComputedStyle(root).getPropertyValue(varName).trim();
    var matched = false;
    list.forEach(function(f){
      var opt = document.createElement("option"); opt.value = f[0]; opt.textContent = f[1];
      if(f[0] === cur){ opt.selected = true; matched = true; }
      sel.appendChild(opt);
    });
    row.appendChild(lb); row.appendChild(sel); sec.appendChild(row);

    var custom = document.createElement("div"); custom.className = "tp-row";
    custom.style.display = matched ? "none" : "flex";
    var lb2 = document.createElement("label"); lb2.textContent = "";
    var txt = document.createElement("input"); txt.type = "text"; txt.placeholder = "Назва шрифту з Google Fonts…";
    if(!matched){ txt.value = cur.replace(/^'([^']+)'.*$/, "$1"); }
    custom.appendChild(lb2); custom.appendChild(txt); sec.appendChild(custom);

    sel.addEventListener("change", function(){
      if(sel.value === "__custom__"){
        custom.style.display = "flex"; txt.focus();
      } else {
        custom.style.display = "none";
        setVar(varName, sel.value);
      }
    });
    function applyCustom(){
      var name = txt.value.trim();
      if(!name) return;
      loadGoogleFont(name);
      var isMono = list === FONT_MONO;
      setVar(varName, "'" + name + "'," + (isMono ? "monospace" : "sans-serif"));
    }
    txt.addEventListener("change", applyCustom);
    txt.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); applyCustom(); } });
  }
  function checkRow(sec, label, initial, onChange){
    var row = document.createElement("div"); row.className = "tp-row tp-check";
    var lb = document.createElement("label"); lb.textContent = label;
    var inp = document.createElement("input"); inp.type = "checkbox"; inp.checked = initial;
    inp.addEventListener("change", function(){ onChange(inp.checked); });
    row.appendChild(lb); row.appendChild(inp); sec.appendChild(row);
    return inp;
  }
  function fileRow(sec, label, onFile){
    var row = document.createElement("div"); row.className = "tp-row";
    var lb = document.createElement("label"); lb.textContent = label;
    var box = document.createElement("label"); box.className = "tp-file"; box.textContent = "Завантажити зображення…";
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0]; if(!f) return;
      var url = URL.createObjectURL(f);
      onFile(url);
      box.textContent = f.name;
    });
    box.appendChild(inp);
    row.appendChild(lb); row.appendChild(box); sec.appendChild(row);
  }

  var styleReduced = document.createElement("style");
  styleReduced.textContent = ".tp-reduced *,.tp-reduced *::before,.tp-reduced *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}";
  document.head.appendChild(styleReduced);

  buildAll();

  /* ---- panel open/close ---- */
  var panel = $("#tp-panel"), toggle = $("#tp-toggle"), closeBtn = $("#tp-close");
  function openPanel(){ panel.classList.add("open"); toggle.setAttribute("aria-expanded","true"); }
  function closePanel(){ panel.classList.remove("open"); toggle.setAttribute("aria-expanded","false"); }
  toggle.addEventListener("click", function(){ panel.classList.contains("open") ? closePanel() : openPanel(); });
  closeBtn.addEventListener("click", closePanel);

  /* ---- reset ---- */
  $("#tp-reset").addEventListener("click", function(){
    TOKENS.forEach(function(t){ root.style.removeProperty(t); });
    document.body.classList.remove("tp-reduced");
    body.innerHTML = "";
    buildAll();
    toast("Скинуто до значень за замовчуванням");
  });
  function buildAll(){
    var secHead = section("Заголовок");
    fontRow(secHead, "Гарнітура", "--font-head", FONT_SANS);
    rangeRow(secHead, "Розмір h1", "--size-h1", 16, 40, 1, "px", function(){ return px("--size-h1"); }, function(v){ setVar("--size-h1", v+"px"); });
    rangeRow(secHead, "Трекінг", "--ls-head", -4, 2, 0.5, "em", function(){ return parseFloat(getComputedStyle(root).getPropertyValue("--ls-head"))*100 || -1.5; }, function(v){ setVar("--ls-head",(v/100)+"em"); });
    var secBody2 = section("Типографіка тіла");
    fontRow(secBody2, "Гарнітура", "--font-body", FONT_SANS);
    rangeRow(secBody2, "Розмір", "--size-body", 12, 18, 0.5, "px", function(){ return px("--size-body"); }, function(v){ setVar("--size-body", v+"px"); });
    rangeRow(secBody2, "Інтерліньяж", "--lh-body", 1.1, 1.9, 0.05, "", function(){ return parseFloat(getComputedStyle(root).getPropertyValue("--lh-body"))||1.45; }, function(v){ setVar("--lh-body", v); });
    var secMono2 = section("Дані (моно)");
    fontRow(secMono2, "Гарнітура", "--font-mono", FONT_MONO);
    var secAccent2 = section("Акцентні кольори");
    colorRow(secAccent2,"Акцент","--accent"); colorRow(secAccent2,"Акцент (світл.)","--accent-b");
    colorRow(secAccent2,"Акцент (яскр.)","--accent-c"); colorRow(secAccent2,"Акцент (темн.)","--accent-d");
    colorRow(secAccent2,"Тривога","--alarm"); colorRow(secAccent2,"Попередження","--warn");
    var secSurf2 = section("Поверхні");
    colorRow(secSurf2,"Тло","--bg"); colorRow(secSurf2,"Тло рейла","--bg-rail");
    colorRow(secSurf2,"Картка","--card"); colorRow(secSurf2,"Картка 2","--card-2"); colorRow(secSurf2,"Картка 3","--card-3");
    colorRow(secSurf2,"Лінія","--line"); colorRow(secSurf2,"Лінія 2","--line-2");
    var secText2 = section("Колір тексту");
    colorRow(secText2,"Основний","--ink"); colorRow(secText2,"Другорядний","--ink-2"); colorRow(secText2,"Третинний","--ink-3");
    var secShape2 = section("Форма");
    rangeRow(secShape2, "Радіус картки", "--r-card", 0, 24, 1, "px", function(){ return px("--r-card"); }, function(v){ setVar("--r-card", v+"px"); });
    rangeRow(secShape2, "Радіус контролу", "--r-ctl", 0, 16, 1, "px", function(){ return px("--r-ctl"); }, function(v){ setVar("--r-ctl", v+"px"); });
    checkRow(secShape2, "Внутрішнє світіння карток", true, function(on){ setVar("--glow", on ? DEFAULTS["--glow"] : "none"); });
    var secImg2 = section("Зображення");
    fileRow(secImg2, "Логотип (рейл)", function(url){ var img=$(".brand .mark img"); if(img) img.src=url; });
    var secAnim2 = section("Анімація");
    rangeRow(secAnim2, "Швидкість UI", "--ui-speed", 0, 400, 10, "мс", function(){ return ms("--ui-speed"); }, function(v){ setVar("--ui-speed", v+"ms"); });
    rangeRow(secAnim2, "Sweep-синхронізація", "--sweep-duration", 200, 2000, 20, "мс", function(){ return ms("--sweep-duration"); }, function(v){ setVar("--sweep-duration", v+"ms"); });
    rangeRow(secAnim2, "Пульс «наживо»", "--beacon-duration", 800, 5000, 100, "мс", function(){ return ms("--beacon-duration"); }, function(v){ setVar("--beacon-duration", v+"ms"); });
    rangeRow(secAnim2, "Виїзд паспорта", "--panel-duration", 80, 600, 10, "мс", function(){ return ms("--panel-duration"); }, function(v){ setVar("--panel-duration", v+"ms"); });
    checkRow(secAnim2, "Вимкнути всю анімацію", false, function(on){ document.body.classList.toggle("tp-reduced", on); });
  }

  /* ---- copy css ---- */
  var toastEl = $("#tp-toast"), toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("on"); }, 2000);
  }
  $("#tp-copy").addEventListener("click", function(){
    var lines = TOKENS.map(function(t){
      var v = getComputedStyle(root).getPropertyValue(t).trim();
      return "  " + t + ": " + v + ";";
    });
    var css = ":root{\n" + lines.join("\n") + "\n}";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(css).then(function(){ toast("CSS скопійовано в буфер"); }).catch(fallbackCopy);
    } else { fallbackCopy(); }
    function fallbackCopy(){
      var ta = document.createElement("textarea");
      ta.value = css; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("CSS скопійовано в буфер"); }catch(e){ toast("Не вдалося скопіювати"); }
      document.body.removeChild(ta);
    }
  });
})();
</script>
</body>
</html>
