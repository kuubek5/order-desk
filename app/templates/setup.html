{% extends "base.html" %}

{% block title %}Початкове налаштування — Order Desk{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="card login-card setup-card">
        <h1>Налаштування Order Desk</h1>
        <p class="login-subtitle">Створіть перший обліковий запис адміністратора</p>

        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/setup">
            <div class="login-field">
                <label for="full_name">Ім’я</label>
                <div class="login-input-wrap">
                    <input type="text" id="full_name" name="full_name" class="login-input"
                           value="{{ full_name|default('') }}" autocomplete="name" required autofocus>
                </div>
            </div>

            <div class="login-field">
                <label for="username">Логін</label>
                <div class="login-input-wrap">
                    <input type="text" id="username" name="username" class="login-input"
                           value="{{ username|default('') }}" autocomplete="username" required>
                </div>
            </div>

            <div class="login-field">
                <label for="password">Пароль (щонайменше 10 символів)</label>
                <div class="login-input-wrap">
                    <input type="password" id="password" name="password" class="login-input"
                           autocomplete="new-password" minlength="10" required>
                </div>
            </div>

            <div class="login-field">
                <label for="password_confirmation">Повторіть пароль</label>
                <div class="login-input-wrap">
                    <input type="password" id="password_confirmation" name="password_confirmation"
                           class="login-input" autocomplete="new-password" minlength="10" required>
                </div>
            </div>

            <button type="submit" class="login-submit">Створити адміністратора</button>
        </form>
    </div>
</div>
{% endblock %}
