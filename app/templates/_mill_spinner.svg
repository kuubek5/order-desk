{# Milling-cutter spinner: a blade with radial flutes that spins while the
   sheet write is in flight. Shown only when the button carries .is-loading
   (see .addwork-submit / .neworder .btn.primary in base.css). #}
<svg class="mill-spin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <g class="mill-spin-rot">
    <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="18" y1="12" x2="21.5" y2="12"/>
      <line x1="16.24" y1="16.24" x2="18.72" y2="18.72"/>
      <line x1="12" y1="18" x2="12" y2="21.5"/>
      <line x1="7.76" y1="16.24" x2="5.28" y2="18.72"/>
      <line x1="6" y1="12" x2="2.5" y2="12"/>
      <line x1="7.76" y1="7.76" x2="5.28" y2="5.28"/>
      <line x1="12" y1="6" x2="12" y2="2.5"/>
      <line x1="16.24" y1="7.76" x2="18.72" y2="5.28"/>
    </g>
  </g>
</svg>
