<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Order Desk{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/fonts.css?v={{ static_ver('css/fonts.css') }}">
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ static_ver('css/tokens.css') }}">
    <link rel="stylesheet" href="/static/css/base.css?v={{ static_ver('css/base.css') }}">
    <script src="/static/js/app.js?v={{ static_ver('js/app.js') }}" defer></script>
    <script src="/static/js/three-0.128.0.min.js" defer></script>
    <script src="/static/js/STLLoader-0.128.0.js" defer></script>
    <script src="/static/js/stl-preview.js?v={{ static_ver('js/stl-preview.js') }}" defer></script>
    <script src="/static/js/stl-gallery.js?v={{ static_ver('js/stl-gallery.js') }}" defer></script>
    {% block extra_head %}{% endblock %}
    <script src="/static/js/htmx-1.9.10.min.js"></script>
</head>
<body>
    <script>try{if(localStorage.getItem('railCollapsed')==='1')document.body.classList.add('rail-collapsed');var _d=localStorage.getItem('queueDensity');if(_d==='compact'||_d==='spacious'||_d==='normal')document.body.setAttribute('data-density',_d);if(localStorage.getItem('layoutEditMode')==='1')document.body.classList.add('layout-edit');}catch(e){}</script>
    {% include "_backdrop.html" %}
    {% block content %}{% endblock %}
    {% include "_update_overlay.html" %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
